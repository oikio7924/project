# API 서버 전용 설정
# 같은 VPC 내 DB 서버에 접속할 때 사용

#version
cms.title=ctcms
cms.version=CT CMS 1.6.75

# API 서버에서 s_site_manager의 USERID='ncp' 행 사용
cms.user=ncp
cms.autoPublish=true
cms.storage=none

# DBMS 종류
db.type=mysql

# mysql 드라이버
mysql.driver=com.mysql.jdbc.Driver
oracle.driver=oracle.jdbc.driver.OracleDriver

# MYSQL - API 서버용 (비공인 IP DB)
mysql.db=monitoring
mysql.url=jdbc:mysql://<HOST>:3306/monitoring
mysql.username=<USER>
mysql.password=<PASSWORD>

# oracle (필요 시)
oracle.url=jdbc:oracle:thin:@<HOST>:1521:xe
oracle.username=<USER>
oracle.password=<PASSWORD>

#slowlog
slowlog.time=0.2
slowlog.path=D:/slowlog/
