<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <base href="/bdweb/" />
  <title>로그인 — DAEYANG</title>
  <link rel="icon" type="image/png" sizes="32x32" href="images/blue-a-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="images/blue-a-16.png" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
    }
    .login-card {
      width: 340px;
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      padding: 32px 28px 28px;
    }
    .login-logo-area { text-align: center; margin-bottom: 20px; }
    .login-logo-area img { height: 40px; }
    .login-logo-sub { font-size: 12px; color: var(--text-muted); margin-top: 6px; }
    .login-title { font-size: 16px; font-weight: 700; color: var(--navy); text-align: center; margin-bottom: 20px; }
    .login-field { margin-bottom: 14px; }
    .login-field label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 5px; }
    .login-field input {
      width: 100%;
      padding: 9px 11px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      font-size: 14px;
    }
    .login-error {
      font-size: 12px;
      color: #b91c1c;
      background: #fee2e2;
      border-radius: var(--radius-sm);
      padding: 8px 10px;
      margin-bottom: 12px;
      display: none;
    }
    .login-submit {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      background: var(--navy);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .login-submit:hover { background: var(--navy-light); }
    .login-check-group { margin-bottom: 4px; display: flex; flex-direction: row; justify-content: space-between; gap: 6px; }
    .login-check-row {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }
    .login-check-row input { margin: 0; cursor: pointer; }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo-area">
        <img src="images/logo-color.png" alt="대양기업 로고" />
        <div class="login-logo-sub">사업개발부 인허가 일정관리</div>
      </div>
      <div class="login-title">로그인</div>
      <p class="login-error" id="login-error"></p>
      <form id="login-form">
        <div class="login-field">
          <label for="username">아이디</label>
          <input id="username" name="username" autocomplete="username" required />
        </div>
        <div class="login-field">
          <label for="password">비밀번호</label>
          <input id="password" type="password" name="password" autocomplete="current-password" required />
        </div>
        <div class="login-check-group">
          <label class="login-check-row">
            <input type="checkbox" id="remember-id" />
            <span>아이디 저장</span>
          </label>
          <label class="login-check-row">
            <input type="checkbox" id="remember-pw" />
            <span>비밀번호 저장</span>
          </label>
          <label class="login-check-row">
            <input type="checkbox" id="auto-login" />
            <span>자동 로그인</span>
          </label>
        </div>
        <button type="submit" class="login-submit">로그인</button>
      </form>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
