<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#dcebe1" />
    <title>EARTHBOUND — 바다 너머의 지구</title>
  </head>
  <body>
    <div id="app">
      <main id="world" aria-label="3D 무인도 게임 화면"></main>
      <div class="vignette"></div>
      <header class="topbar">
        <a class="wordmark" href="#" aria-label="EARTHBOUND 홈"><span class="wordmark-icon">◒</span> EARTHBOUND</a>
        <div class="chapter"><span class="chapter-dot"></span><span>CHAPTER 01</span><b>처음 짓는 세계</b></div>
        <div class="topbar-actions">
          <div class="view-switch" role="group" aria-label="시점 선택">
            <button id="thirdPersonButton" class="view-choice active" aria-pressed="true">3인칭</button>
            <button id="firstPersonButton" class="view-choice" aria-pressed="false">1인칭</button>
          </div>
          <button class="icon-button sound-button" id="soundToggle" aria-label="사운드 설정">♫</button>
        </div>
      </header>

      <section class="mission-card glass">
        <div class="eyebrow"><span class="sun-glyph">✳</span> 첫 번째 아침 <span class="eyebrow-line"></span><span>08:42</span></div>
        <h1 id="missionTitle">섬을 둘러보세요</h1>
        <p id="missionText">파도에 밀려온 재료를 모아<br />첫 번째 뗏목을 만들어 봅시다.</p>
        <div class="mission-progress"><div class="progress-track"><span id="progressFill"></span></div><span id="progressLabel">0 / 4</span></div>
      </section>

      <section class="resource-strip glass" aria-label="보유 자원">
        <div class="resource-label">가방 <span>INVENTORY</span></div>
        <div class="resource" title="나뭇가지"><span class="resource-icon branch-icon">⌁</span><b id="branchCount">0</b><small>나뭇가지</small></div>
        <div class="resource" title="덩굴"><span class="resource-icon vine-icon">〰</span><b id="vineCount">0</b><small>덩굴</small></div>
        <div class="resource" title="판자"><span class="resource-icon plank-icon">▰</span><b id="plankCount">0</b><small>판자</small></div>
      </section>

      <section class="map-card glass" id="mapCard">
        <div class="map-topline"><div><span class="map-kicker">FIELD NOTES</span><h2 id="mapTitle">손으로 그린 지도</h2></div><button class="map-expand" id="mapExpand" aria-label="지도 크게 보기">↗</button></div>
        <div class="map-canvas-wrap"><canvas id="mapCanvas" width="440" height="280" aria-label="탐험 지도"></canvas><div id="mapBadge" class="map-badge">PAPER MAP <span>01</span></div></div>
        <div class="map-footer"><span class="map-legend"><i class="legend-dot"></i> 나의 위치</span><span id="mapHint">탐험할수록 지도가 채워져요</span></div>
      </section>

      <div class="controls-hint glass"><span class="keycap">W</span><span class="keycap">A</span><span class="keycap">S</span><span class="keycap">D</span><span class="control-copy">이동</span><span class="hint-divider"></span><span class="mouse-glyph">◎</span><span class="control-copy">둘러보기</span></div>
      <div class="interact-hint" id="interactHint"><span class="keycap">E</span> <span id="interactText">줍기</span></div>
      <div class="placement-hint" id="placementHint"><b>뗏목 위치 선택</b><span>바다를 가리킨 뒤 클릭 · R 회전 · Esc 취소</span></div>

      <div class="toast" id="toast" role="status"></div>
      <div class="crosshair"><span></span><i></i></div>

      <nav class="action-dock glass" aria-label="게임 메뉴">
        <button class="dock-action" id="journalButton"><span class="dock-icon">▤</span><span>기록</span><kbd>J</kbd></button>
        <button class="dock-action" id="craftButton"><span class="dock-icon">⌘</span><span>제작</span><kbd>C</kbd></button>
        <button class="dock-action map-action" id="mapButton"><span class="dock-icon">⌖</span><span>지도</span><kbd>M</kbd></button>
        <div class="dock-divider"></div>
        <div class="player-chip"><div class="avatar">M</div><div><b>탐험가</b><small>섬의 발견자</small></div><button class="dots" id="moreButton" aria-label="더 보기">···</button></div>
      </nav>

      <aside class="quest-toast glass" id="questToast"><span class="quest-check">✓</span><div><small>새로운 목표</small><b>뗏목 재료를 모으세요</b></div><button id="dismissQuest" aria-label="닫기">×</button></aside>
    </div>
    <div id="modalLayer" class="modal-layer hidden"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
